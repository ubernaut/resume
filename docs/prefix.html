<html>

  <body id="body" class="crt">
    <script>
      document.body.classList.add(
        window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light"
      );
    </script>
    <span
      id="togglebtn"
      onclick="window.toggleDark()"
      title="toggle light/dark mode"
    >
      <h3>☼</h3>
    </span>
